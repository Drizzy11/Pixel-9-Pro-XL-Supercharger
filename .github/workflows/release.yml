name: Supercharger Auto-Release Engine

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          set -x

          TAG_NAME="${GITHUB_REF_NAME}"
          MODULE_VERSION="$(sed -n 's/^version=//p' module.prop | head -n1)"

          if [[ -z "${MODULE_VERSION}" ]]; then
            echo "Failed to read version from module.prop" >&2
            exit 1
          fi

          if [[ "${TAG_NAME}" != "${MODULE_VERSION}" ]]; then
            echo "Tag mismatch: pushed tag '${TAG_NAME}' does not match module.prop version '${MODULE_VERSION}'" >&2
            exit 1
          fi

          CHANNEL="stable"
          PRERELEASE="false"
          TITLE_SUFFIX=""

          if [[ "${TAG_NAME}" == *"-alpha"* ]]; then
            CHANNEL="alpha"
            PRERELEASE="true"
            TITLE_SUFFIX=" (Alpha)"
          elif [[ "${TAG_NAME}" == *"-beta"* ]]; then
            CHANNEL="beta"
            PRERELEASE="true"
            TITLE_SUFFIX=" (Beta)"
          elif [[ "${TAG_NAME}" == *"-rc"* ]]; then
            CHANNEL="rc"
            PRERELEASE="true"
            TITLE_SUFFIX=" (RC)"
          elif [[ "${TAG_NAME}" == *-* ]]; then
            CHANNEL="prerelease"
            PRERELEASE="true"
            TITLE_SUFFIX=" (Prerelease)"
          fi

          ASSET_BASENAME="Pixel-9-Series-Supercharger-${TAG_NAME}"
          RELEASE_TITLE="Pixel 9 Series Supercharger ${TAG_NAME}${TITLE_SUFFIX}"

          echo "tag_name=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "module_version=${MODULE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "channel=${CHANNEL}" >> "$GITHUB_OUTPUT"
          echo "is_prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "asset_basename=${ASSET_BASENAME}" >> "$GITHUB_OUTPUT"
          echo "release_title=${RELEASE_TITLE}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run release preflight
        shell: bash
        run: |
          set -euo pipefail
          set -x

          python3 scripts/check.py

      - name: Build and validate release assets
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build_release.py --output "${RUNNER_TEMP}/supercharger-release"

      - name: Publish or update GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ steps.meta.outputs.tag_name }}
          RELEASE_TITLE: ${{ steps.meta.outputs.release_title }}
          PRERELEASE: ${{ steps.meta.outputs.is_prerelease }}
          ASSET_BASENAME: ${{ steps.meta.outputs.asset_basename }}
        shell: bash
        run: |
          set -euo pipefail
          set -x

          RELEASE_DIR="${RUNNER_TEMP}/supercharger-release"
          ZIP_PATH="${RELEASE_DIR}/${ASSET_BASENAME}.zip"
          SHA_PATH="${ZIP_PATH}.sha256"

          CREATE_ARGS=()
          EDIT_ARGS=()

          if [[ "${PRERELEASE}" == "true" ]]; then
            CREATE_ARGS+=(--prerelease --latest=false)
            EDIT_ARGS+=(--prerelease --latest=false)
          else
            CREATE_ARGS+=(--latest)
          fi

          if gh release view "${TAG_NAME}" --json isDraft --jq .isDraft > "${RUNNER_TEMP}/release-is-draft" 2> "${RUNNER_TEMP}/release-view-error"; then
            if [[ "$(cat "${RUNNER_TEMP}/release-is-draft")" != "true" ]]; then
              echo "Release ${TAG_NAME} is published. Verifying existing assets without changing them."
              VERIFY_DIR="${RUNNER_TEMP}/published-release-check"
              gh release download "${TAG_NAME}" --dir "${VERIFY_DIR}" \
                --pattern "${ASSET_BASENAME}.zip" --pattern "${ASSET_BASENAME}.zip.sha256" \
                --pattern update.json --pattern release-manifest.json
              for asset in "${ASSET_BASENAME}.zip" "${ASSET_BASENAME}.zip.sha256" update.json release-manifest.json; do
                cmp "${RELEASE_DIR}/${asset}" "${VERIFY_DIR}/${asset}" || {
                  echo "Published asset differs: ${asset}. Prepare a new version instead of overwriting it." >&2
                  exit 1
                }
              done
              exit 0
            fi
            echo "Release ${TAG_NAME} is a draft. Updating the prepared assets."

            gh release upload "${TAG_NAME}" \
              "${ZIP_PATH}" \
              "${SHA_PATH}" \
              "${RELEASE_DIR}/update.json" \
              "${RELEASE_DIR}/release-manifest.json" \
              --clobber

            gh release edit "${TAG_NAME}" \
              --title "${RELEASE_TITLE}" \
              --draft \
              --notes-file "${RELEASE_DIR}/release-notes.md" \
              "${EDIT_ARGS[@]}"
          elif grep -q 'release not found' "${RUNNER_TEMP}/release-view-error"; then
            echo "Release ${TAG_NAME} does not exist. Creating it."

            gh release create "${TAG_NAME}" \
              "${ZIP_PATH}" \
              "${SHA_PATH}" \
              "${RELEASE_DIR}/update.json" \
              "${RELEASE_DIR}/release-manifest.json" \
              --verify-tag \
              --title "${RELEASE_TITLE}" \
              --notes-file "${RELEASE_DIR}/release-notes.md" \
              "${CREATE_ARGS[@]}"
          else
            cat "${RUNNER_TEMP}/release-view-error" >&2
            exit 1
          fi
