name: Repository checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run repository checks
        run: python3 scripts/check.py
      - name: Validate release packaging from the checked-out commit
        run: python3 scripts/build_release.py --output "${RUNNER_TEMP}/supercharger-release-check"

  windows-harness:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify native Windows process containment
        run: python -m unittest discover -s scripts -p test_shell_harness.py
